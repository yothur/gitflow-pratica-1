<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&family=Playfair+Display:ital,wght@0,900;1,900&display=swap"
        rel="stylesheet">
    <title>TaskList</title>
</head>

<body>
    <header>
        <div class="tag">Organização</div>
        <h1>Lista de<br /><span>Tarefas</span></h1>
        <p class="subtitle">Anote, organize, conquiste.</p>
        <div class="decoration">✓</div>
    </header>
    <main>
        <div class="input-row">
            <input type="text" id="task-input" placeholder="Nova tarefa..." maxlength="120" />
            <button class="btn-add" id="add-btn" title="Adicionar tarefa">+</button>
        </div>
        <p class="error-msg" id="error-msg"></p>
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="pending">Pendentes</button>
            <button class="filter-btn" data-filter="done">Concluídas</button>
        </div>
        <div class="task-list"></div>
    </main>
    <footer>
        <div class="footer-stats">
            <span class="stats-text">1 de 4 concluídas</span>
            <button class="clear-btn">Limpar concluídas</button>
        </div>
    </footer>

</body>
<script src="./script.js"></script>

</html>
