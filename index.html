<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>TaskList</title>
</head>

<body>
    <header>
        <div class="tag">Organização</div>
        <h1>Lista de<br /><span>Tarefas</span></h1>
        <p class="subtitle">Anote, organize, conquiste.</p>
        <div class="decoration">✓</div>
    </header>
    <main>
        <div class="input-row">
            <input type="text" id="task-input" placeholder="Nova tarefa..." maxlength="120" />
            <button class="btn-add" id="add-btn" title="Adicionar tarefa">+</button>
        </div>
        <div class="task-list">
            <div class="task-item">
                <input type="checkbox" class="task-check" />
                <span class="task-text">Comprar mantimentos na feira</span>
                <button class="btn-del" title="Remover tarefa">&#x2715;</button>
            </div>
            <div class="task-item">
                <input type="checkbox" class="task-check" />
                <span class="task-text">Responder e-mails do trabalho</span>
                <button class="btn-del" title="Remover tarefa">&#x2715;</button>
            </div>
        </div>
    </main>
    <footer>
        <div class="footer-stats">
            <span class="stats-text">1 de 4 concluídas</span>
            <button class="clear-btn">Limpar concluídas</button>
        </div>
    </footer>

</body>
<script src="./script.js"></script>

</html>
